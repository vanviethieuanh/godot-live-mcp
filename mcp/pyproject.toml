[project]
name = "godot-live-mcp"
version = "0.1.0"
description = "MCP server for the Godot Tree live scene inspector bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
]

[project.scripts]
godot-live-mcp = "godot_live_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_live_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
